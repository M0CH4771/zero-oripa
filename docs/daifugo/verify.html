<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DAIFUGO | 独立検証版</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#102a26;color:#f5f2e8;margin:0;padding:16px}main{max-width:740px;margin:auto}h1{font-size:27px;margin:8px 0}section{background:#193e35;border:1px solid #58776a;border-radius:10px;padding:14px;margin:12px 0}button,select{font:inherit;padding:10px;border:1px solid #bfc7ae;border-radius:6px;background:#fff5df;color:#24372c;cursor:pointer;margin:3px}button:disabled{opacity:.45;cursor:default}.card{width:65px;min-height:78px;font:bold 20px Georgia;background:#fffdf5}.red{color:#b42332}.selected{border:3px solid #f5c24d;background:#fff0ae;transform:translateY(-4px)}#cpu{display:flex;gap:10px;flex-wrap:wrap}#field{font:bold 28px Georgia;min-height:38px}#log{white-space:pre-wrap;font:13px system-ui;line-height:1.5}#result{font-weight:bold;color:#ffe29b}small{color:#c2ddcd}a{color:#ffd97d}</style></head><body><main><a href="../">← ZERO ORIPA</a><h1>ZERO DAIFUGO</h1><p>独立検証版 · 無料・景品なし・実コイン消費なし</p><section><strong>テスト条件</strong><p>報酬ランクは対戦前に指定し、検証済み手札を選びます。CPUも含む全員の手札は開始時に固定され、プレイ中に変更しません。対戦順位と報酬ランクは別表示です。ここでは抽選・実報酬処理は未実装です。</p><label>テスト報酬ランク <select id="target"><option value="1">1着相当</option><option value="2">2着相当</option><option value="3">3着相当</option><option value="4">4着相当</option></select></label><label>初期手札 <select id="family"><option value="">ランダム</option></select></label><button id="start">手札を配る</button><p id="bankSummary"></p><small>13枚・ジョーカーなし／同じ数字1〜4枚・階段／反則上がり／革命／8切り／同じマーク集合の縛り／場が空なら出札必須。パス後は場が流れるまで参加不可。反則上がりは下位から順位確定。</small></section><section><div id="cpu"></div><h3 id="turn">開始待機中</h3><div id="rule"></div><div id="field"></div></section><section><label><input id="sort" type="checkbox">マーク順</label><div id="hand"></div><button id="play" disabled>出札</button><button id="pass" disabled>パス</button><button id="hint" disabled>ヒント</button><p id="result"></p><div id="proof"></div><button id="verify">選択中の手札を再検証</button></section><section><h3>対戦ログ</h3><pre id="log"></pre></section></main><script type="module" src="./ui.mjs?v=16"></script></body></html>
