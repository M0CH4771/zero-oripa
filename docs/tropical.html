<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>ZERO HIBISCUS</title><link rel="stylesheet" href="./tropical.css?v=hibiscus100"></head><body data-mode="idle">
<main><header><a href="./#home" aria-label="戻る">✕</a><div class="logo"><small>ZERO</small><strong>HIBISCUS</strong><span>ISLAND RUSH</span></div><button id="sound" aria-label="音">♪</button></header>
